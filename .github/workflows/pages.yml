name: Publicar agenda en GitHub Pages
on:
  push:
    branches: [main, github-pages-deploy]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for GitHub Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..15}; do
            visible=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name' 2>/dev/null | grep -Fx "$EXPECTED_ARTIFACT" || true)
            if [ "$visible" = "$EXPECTED_ARTIFACT" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "GitHub Actions todavía no muestra el artefacto $EXPECTED_ARTIFACT" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
